spring:
  application:
    name: leave-service
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://localhost:5432/leave_management_system
    username: postgres
    password: postgres
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: LeaveHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        default_batch_fetch_size: 50
        jdbc:
          fetch_size: 50
          batch_size: 25
        order_inserts: true
        order_updates: true

  flowable:
    database-schema-update: true
    async-executor-activate: true
    process-definition-location-prefix: classpath*:processes/
    process-definition-location-suffixes:
      - "**.bpmn20.xml"
      - "**.bpmn"

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:viveksinhchavda@gmail.com}
    password: ${MAIL_PASSWORD:drauzuufuzlddfwy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  sql:
    init:
      mode: always

server:
  port: 8082

app:
  mail:
    from: ${MAIL_FROM:viveksinhchavda@gmail.com}
    logo-path: ${MAIL_LOGO_PATH:}
    batch-size: ${MAIL_BATCH_SIZE:25}
  leave-reminder:
    cron: ${APP_LEAVE_REMINDER_CRON:0 */1 * * * *}
    cron-4day: ${APP_LEAVE_REMINDER_CRON_4DAY:0 0 8 * * *}
    cron-2day: ${APP_LEAVE_REMINDER_CRON_2DAY:0 1 8 * * *}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: leave-service
        url: /v3/api-docs
      - name: flowable-api
        url: /flowable-swagger-process.yaml
  packages-to-scan: com.cresensolutions.leaveservice
